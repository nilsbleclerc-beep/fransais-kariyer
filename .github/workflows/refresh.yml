name: "🔄 Actualisation Quotidienne des Offres & Déploiement PWA"

on:
  schedule:
    # Tous les jours à 05:00 UTC (08:00 heure d'Istanbul / 07:00 heure de Paris)
    - cron: '0 5 * * *'
  workflow_dispatch: # Déclencheur manuel 1-clic depuis l'interface GitHub
  push:
    branches:
      - master
      - main
    paths:
      - 'companies_data.py'
      - 'scrapers.py'
      - 'main.py'
      - 'quality.py'
      - 'scorer.py'
      - 'profile.json'
      - 'sources/**'
      - 'exporter.py'
      - 'pwa_*'

# Permission pour commiter les nouvelles offres.
# Le déploiement est fait par GitHub Pages (source : branche master) à chaque push du robot.
permissions:
  contents: write

concurrency:
  group: "bilateral-refresh"
  cancel-in-progress: true

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎨 Générer les icônes PWA HD
        run: |
          python generate_icons.py

      - name: 🚀 Exécuter le Scanner Bilatéral France-Turquie
        # Clés des API d'offres : vides si le secret n'est pas défini (la source renvoie alors [] sans erreur)
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: |
          python main.py --pages=4

      - name: 🔍 Vérifier la synchronisation des fichiers
        run: |
          test -f index.html || cp dashboard.html index.html
          ls -la index.html dashboard.html offres_france_turquie.json rejected_offers.json

      - name: 💾 Enregistrer et commiter les nouvelles offres
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html offres_france_turquie.json offres_france_turquie.csv rejected_offers.json manifest.json sw.js icon* apple-touch-icon.png favicon*
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Auto-Refresh] Nouvelles opportunités bilatérales $(date +'%d/%m/%Y %H:%M')"
            git push
          else
            echo "Aucun changement détecté dans les offres."
          fi
